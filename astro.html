<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Premium Natal Chart</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh;
  overflow-x:hidden;
  background:radial-gradient(circle at top,#0b1d39 0%,#050b17 55%,#02060d 100%);
  font-family:Arial,sans-serif;
  color:#94a3b8;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 20% 20%,rgba(56,189,248,.08),transparent 30%),
    radial-gradient(circle at 80% 30%,rgba(255,215,0,.05),transparent 30%),
    radial-gradient(circle at 50% 80%,rgba(56,189,248,.04),transparent 40%);
  pointer-events:none;
}
.container{width:100%;max-width:1120px;margin:auto;padding:22px;position:relative;z-index:2}

/* Top action bar */
.top-bar{
  position:fixed;
  top:18px;
  left:18px;
  right:18px;
  z-index:5;
  display:flex;
  align-items:center;
  gap:10px;
  pointer-events:none;
}
.top-bar > *{pointer-events:auto;}

.back-btn{
  background:rgba(16,27,45,.9);color:#38bdf8;border:1px solid rgba(56,189,248,.3);
  border-radius:18px;padding:12px 18px;font-size:18px;cursor:pointer;backdrop-filter:blur(12px);
  box-shadow:0 0 20px rgba(56,189,248,.2),inset 0 0 10px rgba(255,215,0,.04);
  transition:all .25s ease;
}
.back-btn:hover{
  background:rgba(16,27,45,1);
  border-color:rgba(56,189,248,.6);
  box-shadow:0 0 30px rgba(56,189,248,.35),inset 0 0 15px rgba(255,215,0,.08);
  transform:translateY(-1px);
}

.action-group{
  display:flex;
  gap:8px;
  margin-left:auto;
}

.action-btn{
  width:44px;
  height:44px;
  border-radius:14px;
  background:rgba(16,27,45,.9);
  border:1px solid rgba(148,163,184,.25);
  color:#94a3b8;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  backdrop-filter:blur(12px);
  box-shadow:0 0 15px rgba(0,0,0,.2);
  transition:all .25s ease;
}
.action-btn:hover{
  color:#38bdf8;
  border-color:rgba(56,189,248,.5);
  box-shadow:0 0 20px rgba(56,189,248,.25);
  transform:translateY(-2px);
}
.action-btn svg{
  width:22px;
  height:22px;
  fill:none;
  stroke:currentColor;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.header{text-align:center;padding-top:78px;margin-bottom:18px}
.title{
  font-size:56px;font-weight:700;color:#38bdf8;letter-spacing:4px;
  text-shadow:0 0 15px rgba(56,189,248,.7),0 0 35px rgba(56,189,248,.3);
}
.birth{margin-top:14px;color:#FFD700;font-size:28px;text-shadow:0 0 14px rgba(255,215,0,.3)}
.sub{margin-top:10px;color:#64748b;font-size:15px}
.status{margin-top:10px;font-size:13px;color:#4ade80}
.layout{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(320px,.75fr);gap:22px;align-items:start}
.card{
  background:rgba(10,20,35,.78);border-radius:26px;border:1px solid rgba(56,189,248,.12);
  backdrop-filter:blur(14px);box-shadow:0 0 45px rgba(56,189,248,.08),inset 0 0 25px rgba(255,215,0,.03);
  padding:22px;margin-top:22px;
}
.chart-card{display:flex;justify-content:center;align-items:center}
svg{width:100%;max-width:820px;height:auto}
.section-title{color:#FFD700;font-size:25px;margin-bottom:15px;text-shadow:0 0 12px rgba(255,215,0,.3)}
.data-grid{display:grid;grid-template-columns:1fr;gap:10px}
.row{display:grid;grid-template-columns:92px 1fr 72px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(148,163,184,.12);font-size:14px}
.row:last-child{border-bottom:0}
.name{font-weight:700}.pos{color:#dbeafe}.house{color:#f6cb71;text-align:right}
.angles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.angle-box{background:rgba(15,23,42,.65);border:1px solid rgba(56,189,248,.12);border-radius:14px;padding:13px;text-align:center}
.angle-label{color:#FFD700;font-size:12px;margin-bottom:5px}.angle-value{color:#dbeafe;font-size:18px;font-weight:700}
.aspect-row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid rgba(148,163,184,.1);font-size:13px}
.aspect-row:last-child{border-bottom:0}
.muted{color:#64748b;font-size:12px;line-height:1.45}
.error{color:#fb7185}

/* Print styles */
@media print{
  body::before,.top-bar,.loading-panel{display:none !important}
  body{
    background:#ffffff !important;
    color:#1a1a1a !important;
  }
  .container{padding:0}
  .header{padding-top:20px}
  .title{color:#1a1a1a !important;text-shadow:none !important}
  .birth{color:#333 !important;text-shadow:none !important}
  .sub{color:#666 !important}
  .status{color:#4ade80 !important}
  .card{
    background:transparent !important;
    border:1px solid #ccc !important;
    box-shadow:none !important;
    backdrop-filter:none !important;
    break-inside:avoid;
    page-break-inside:avoid;
    color:#1a1a1a !important;
  }
  .section-title{color:#333 !important;text-shadow:none !important}
  .name{color:#1a1a1a !important}
  .pos{color:#333 !important}
  .house{color:#555 !important}
  .angle-label{color:#333 !important}
  .angle-value{color:#1a1a1a !important}
  .muted{color:#666 !important}
  #chartSvg circle[fill="#020817"]{fill:#ffffff !important;stroke:#333 !important}
  #chartSvg circle[stroke="#FFD700"]{stroke:#333 !important}
  #chartSvg circle[stroke="#38bdf8"]{stroke:#666 !important}
  #chartSvg text[fill="#FFD700"]{fill:#333 !important;filter:none !important}
  #chartSvg line[stroke="#FFD700"]{stroke:#333 !important}
  #chartSvg line[stroke="#38bdf8"]{stroke:#999 !important}
  #chartSvg line[stroke="#334155"]{stroke:#ddd !important}
  #chartSvg text[fill="#94a3b8"]{fill:#666 !important}
  #planetLayer circle{fill:#ffffff !important;stroke:#333 !important}
  #planetLayer text{fill:#333 !important;filter:none !important}
  #planetLayer line{stroke:#999 !important}
  #angleLayer text{fill:#333 !important;filter:none !important}
  #aspectLayer line{opacity:0.3 !important}
}

.loading-panel{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(2,6,13,.86);
  backdrop-filter:blur(10px);
  transition:opacity .35s ease, visibility .35s ease;
}
.loading-panel.hidden{opacity:0;visibility:hidden;pointer-events:none}
.loading-box{
  width:min(430px,calc(100% - 36px));
  border:1px solid rgba(56,189,248,.24);
  border-radius:22px;
  background:rgba(10,20,35,.92);
  box-shadow:0 0 45px rgba(56,189,248,.16), inset 0 0 18px rgba(255,215,0,.04);
  padding:28px;
  text-align:center;
}
.loading-orbit{
  width:84px;
  height:84px;
  margin:0 auto 18px;
  border-radius:50%;
  border:1px solid rgba(255,215,0,.38);
  position:relative;
}
.loading-orbit::before{
  content:"";
  position:absolute;
  inset:9px;
  border-radius:50%;
  border:1px solid rgba(56,189,248,.32);
}
.loading-orbit::after{
  content:"";
  width:12px;
  height:12px;
  border-radius:50%;
  background:#38bdf8;
  box-shadow:0 0 16px rgba(56,189,248,.9);
  position:absolute;
  top:7px;
  left:50%;
  transform:translateX(-50%);
  transform-origin:0 35px;
  animation:orbitSpin 1.15s linear infinite;
}
.loading-title{font-size:22px;color:#FFD700;margin-bottom:8px}
.loading-text{font-size:14px;color:#94a3b8;line-height:1.45}
@keyframes orbitSpin{
  from{transform:rotate(0deg) translateX(-50%)}
  to{transform:rotate(360deg) translateX(-50%)}
}

@media(max-width:900px){
  .layout{grid-template-columns:1fr}
  .title{font-size:38px}
  .birth{font-size:20px}
  .top-bar{left:10px;right:10px;top:10px}
  .back-btn{padding:10px 14px;font-size:16px}
  .action-btn{width:40px;height:40px}
  .action-btn svg{width:20px;height:20px}
  .header{padding-top:70px}
  .container{padding:14px}
}
</style>

  canvas.height = a4Height * 2;

  ctx.fillStyle = '#02060d';
  ctx.fillRect(0, 0, a4Width, a4Height);

  grad.addColorStop(0.55, '#050b17');

            .muted{color:#64748b;font-size:12px;line-height:1.45}
          </style>
          ${document.querySelector('.container').outerHTML}
        </div>
      </foreignObject>
    </svg>`;

    const img = new Image();
    const svgBlob = new Blob([svgData], {type: 'image/svg+xml;charset=utf-8'});
    const url = URL.createObjectURL(svgBlob);

    return new Promise((resolve, reject) => {
      img.onload = () => {
        // Scale to fit A4 while maintaining aspect ratio
        const contentRatio = img.width / img.height;
        const a4Ratio = a4Width / a4Height;

        let drawWidth, drawHeight, offsetX, offsetY;
        if (contentRatio > a4Ratio) {
          drawWidth = a4Width - 40;
          drawHeight = drawWidth / contentRatio;
          offsetX = 20;
          offsetY = (a4Height - drawHeight) / 2;
        } else {
          drawHeight = a4Height - 40;
          drawWidth = drawHeight * contentRatio;
          offsetX = (a4Width - drawWidth) / 2;
          offsetY = 20;
        }

        ctx.drawImage(img, offsetX, offsetY, drawWidth, drawHeight);
        URL.revokeObjectURL(url);
        resolve(canvas);
      };
      img.onerror = reject;
      img.src = url;
    });
  } catch(e) {
    console.error('Capture error:', e);
    // Fallback: return canvas with just background
    return canvas;
  }
}

function parseDate(value){
  const match = /^(\d{2})\.(\d{2})\.(\d{4})$/.exec(value);
  if(!match) throw new Error("Use date format DD.MM.YYYY");
  return {day:+match[1], month:+match[2], year:+match[3]};
}

function parseTime(value){
  const match = /^(\d{2}):(\d{2})$/.exec(value || "12:00");
  if(!match) return {hours:12, minutes:0};
  return {hours:+match[1], minutes:+match[2]};
}

function getZonedOffsetMinutes(year, month, day, hour, minute, timeZone){
  const utcGuess = Date.UTC(year, month - 1, day, hour, minute);
  const parts = new Intl.DateTimeFormat("en-US", {
    timeZone, hour12:false, year:"numeric", month:"2-digit", day:"2-digit",
    hour:"2-digit", minute:"2-digit", second:"2-digit"
  }).formatToParts(new Date(utcGuess)).reduce((acc, p) => (acc[p.type] = p.value, acc), {});
  const asUTC = Date.UTC(+parts.year, +parts.month - 1, +parts.day, +parts.hour, +parts.minute, +parts.second);
  return (asUTC - utcGuess) / 60000;
}

function localBirthToUtc(date, time, coords){
  if(coords.tz){
    const offset = getZonedOffsetMinutes(date.year, date.month, date.day, time.hours, time.minutes, coords.tz);
    return {utc:new Date(Date.UTC(date.year, date.month - 1, date.day, time.hours, time.minutes) - offset * 60000), method:`IANA timezone ${coords.tz}`};
  }
  const offset = Math.round(coords.lon / 15 * 60);
  return {utc:new Date(Date.UTC(date.year, date.month - 1, date.day, time.hours, time.minutes) - offset * 60000), method:"estimated timezone from longitude"};
}

function julianDay(date){
  return date.getTime() / 86400000 + 2440587.5;
}

function normalize(deg){
  deg %= 360;
  return deg < 0 ? deg + 360 : deg;
}

function toRad(deg){ return deg * Math.PI / 180; }

function fallbackPlanetLongitude(jd, name){
  const T = (jd - 2451545.0) / 36525;
  let M = 0, L = 0;
  switch(name){
    case "Sun":
      M = 357.52911 + 35999.05029 * T;
      L = 280.46646 + 36000.76983 * T + 1.914602 * Math.sin(toRad(M)) + .019993 * Math.sin(toRad(2*M));
      break;
    case "Moon":
      M = 134.963 + 477198.867 * T;
      L = 218.316 + 481267.881 * T + 6.289 * Math.sin(toRad(M));
      break;
    case "Mercury":
      M = 174.796 + 149472.515 * T;
      L = 252.251 + 149472.674 * T + 23.44 * Math.sin(toRad(M)) + 2.98 * Math.sin(toRad(2*M));
      break;
    case "Venus":
      M = 50.416 + 58519.813 * T;
      L = 181.980 + 58517.816 * T + .775 * Math.sin(toRad(M));
      break;
    case "Mars":
      M = 19.373 + 19140.299 * T;
      L = 355.433 + 19140.299 * T + 10.691 * Math.sin(toRad(M));
      break;
    case "Jupiter":
      M = 20.020 + 3034.906 * T;
      L = 34.351 + 3034.906 * T + 5.555 * Math.sin(toRad(M));
      break;
    case "Saturn":
      M = 317.020 + 1222.114 * T;
      L = 50.077 + 1222.114 * T + 6.406 * Math.sin(toRad(M));
      break;
    case "Uranus":
      M = 141.050 + 428.467 * T;
      L = 314.055 + 428.467 * T + 5.332 * Math.sin(toRad(M));
      break;
    case "Neptune":
      M = 256.225 + 218.459 * T;
      L = 304.348 + 218.459 * T + 2.552 * Math.sin(toRad(M));
      break;
    case "Pluto":
      L = 238.929 + 145.208 * T + 17.1 * Math.sin(toRad(238.9 + 145.2 * T));
      break;
  }
  return normalize(L);
}

function gmst(jd){
  const T = (jd - 2451545.0) / 36525;
  return normalize(280.46061837 + 360.98564736629 * (jd - 2451545) + .000387933 * T*T - T*T*T / 38710000);
}

function calculateAscMc(jd, lat, lon){
  const eps = toRad(23.439291);
  const theta = toRad(normalize(gmst(jd) + lon));
  const phi = toRad(lat);
  const mc = normalize(Math.atan2(Math.sin(theta), Math.cos(theta) * Math.cos(eps)) * 180 / Math.PI);
  const asc = normalize(Math.atan2(-Math.cos(theta), Math.sin(theta) * Math.cos(eps) + Math.tan(phi) * Math.sin(eps)) * 180 / Math.PI);
  return {asc, mc};
}

function equalHouses(asc){
  return Array.from({length:12}, (_, i) => normalize(asc + i * 30));
}

function signOf(longitude){
  const index = Math.floor(normalize(longitude) / 30) % 12;
  return {index, name:signNames[index], symbol:signSymbols[index], degree:normalize(longitude) % 30};
}

function formatPos(longitude){
  const s = signOf(longitude);
  const deg = Math.floor(s.degree);
  const min = Math.round((s.degree - deg) * 60);
  return `${s.symbol} ${s.name} ${deg}°${String(min).padStart(2,"0")}'`;
}

function getHouse(longitude, cusps){
  const p = normalize(longitude);
  for(let i = 0; i < 12; i++){
    const c1 = normalize(cusps[i]);
    const c2 = normalize(cusps[(i + 1) % 12]);
    if(c2 < c1){
      if(p >= c1 || p < c2) return i + 1;
    }else if(p >= c1 && p < c2){
      return i + 1;
    }
  }
  return 1;
}

function findAspects(data){
  const defs = [
    {name:"Conjunction", angle:0, orb:8, color:"#FFD700"},
    {name:"Sextile", angle:60, orb:5, color:"#38bdf8"},
    {name:"Square", angle:90, orb:6, color:"#fb7185"},
    {name:"Trine", angle:120, orb:6, color:"#4ade80"},
    {name:"Opposition", angle:180, orb:8, color:"#fb7185"}
  ];
  const found = [];
  for(let i = 0; i < data.length; i++){
    for(let j = i + 1; j < data.length; j++){
      let diff = Math.abs(data[i].longitude - data[j].longitude);
      if(diff > 180) diff = 360 - diff;
      for(const a of defs){
        const orb = Math.abs(diff - a.angle);
        if(orb <= a.orb) found.push({...a, p1:data[i], p2:data[j], orb});
      }
    }
  }
  return found.sort((a,b) => a.orb - b.orb);
}

function svgEl(name, attrs, text){
  const el = document.createElementNS(NS, name);
  Object.entries(attrs || {}).forEach(([k,v]) => el.setAttribute(k, v));
  if(text !== undefined) el.textContent = text;
  return el;
}

function point(longitude, radius, asc){
  const angle = toRad(longitude - asc + 180);
  return {x:centerX + radius * Math.cos(angle), y:centerY + radius * Math.sin(angle)};
}

function renderWheel(data, cusps, asc, mc, aspects){
  ["zodiacLayer","houseLayer","aspectLayer","planetLayer","angleLayer"].forEach(id => document.getElementById(id).replaceChildren());
  const zodiacLayer = document.getElementById("zodiacLayer");
  const houseLayer = document.getElementById("houseLayer");
  const aspectLayer = document.getElementById("aspectLayer");
  const planetLayer = document.getElementById("planetLayer");
  const angleLayer = document.getElementById("angleLayer");

  for(let i = 0; i < 12; i++){
    const mid = i * 30 + 15;
    const p = point(mid, 338, asc);
    zodiacLayer.appendChild(svgEl("text", {x:p.x, y:p.y, fill:"#FFD700", "font-size":42, "text-anchor":"middle", "dominant-baseline":"middle", filter:"url(#glowGold)"}, signSymbols[i]));
    for(let d = 0; d < 30; d += 5){
      const a = i * 30 + d;
      const p1 = point(a, d === 0 ? 315 : 326, asc);
      const p2 = point(a, 370, asc);
      houseLayer.appendChild(svgEl("line", {x1:p1.x, y1:p1.y, x2:p2.x, y2:p2.y, stroke:d === 0 ? "#FFD700" : "#334155", "stroke-width":d === 0 ? 1.6 : .8, opacity:.75}));
    }
  }

  cusps.forEach((cusp, i) => {
    const p1 = point(cusp, 185, asc);
    const p2 = point(cusp, 370, asc);
    const major = i === 0 || i === 3 || i === 6 || i === 9;
    houseLayer.appendChild(svgEl("line", {x1:p1.x, y1:p1.y, x2:p2.x, y2:p2.y, stroke:major ? "#FFD700" : "#38bdf8", "stroke-width":major ? 2.4 : 1, opacity:major ? .95 : .5}));
    const num = point(normalize(cusp + 15), 215, asc);
    houseLayer.appendChild(svgEl("text", {x:num.x, y:num.y, fill:"#94a3b8", "font-size":18, "text-anchor":"middle", "dominant-baseline":"middle"}, String(i + 1)));
  });

  aspects.slice(0, 24).forEach(a => {
    const p1 = point(a.p1.longitude, 185, asc);
    const p2 = point(a.p2.longitude, 185, asc);
    aspectLayer.appendChild(svgEl("line", {x1:p1.x, y1:p1.y, x2:p2.x, y2:p2.y, stroke:a.color, "stroke-width":1.4, opacity:.42}));
  });

  const used = [];
  data.forEach(p => {
    const base = point(p.longitude, 260, asc);
    let x = base.x, y = base.y;
    used.forEach(u => {
      if(Math.hypot(x - u.x, y - u.y) < 34){
        x += 18;
        y += 12;
      }
    });
    used.push({x,y});
    planetLayer.appendChild(svgEl("circle", {cx:x, cy:y, r:22, fill:"rgba(2,8,23,.92)", stroke:p.color, "stroke-width":2}));
    planetLayer.appendChild(svgEl("text", {x, y:y + 1, fill:p.color, "font-size":32, "text-anchor":"middle", "dominant-baseline":"middle"}, p.symbol));
    const tick = point(p.longitude, 315, asc);
    planetLayer.appendChild(svgEl("line", {x1:base.x, y1:base.y, x2:tick.x, y2:tick.y, stroke:p.color, "stroke-width":1, opacity:.55}));
  });

  [{label:"ASC", lon:asc}, {label:"MC", lon:mc}, {label:"DSC", lon:normalize(asc + 180)}, {label:"IC", lon:normalize(mc + 180)}].forEach(a => {
    const p = point(a.lon, 398, asc);
    angleLayer.appendChild(svgEl("text", {x:p.x, y:p.y, fill:"#FFD700", "font-size":23, "font-weight":"700", "text-anchor":"middle", "dominant-baseline":"middle"}, a.label));
  });
}

function renderTables(data, cusps, asc, mc, aspects, details){
  document.getElementById("planetTable").innerHTML = data.map(p => `
    <div class="row">
      <div class="name" style="color:${p.color}">${p.symbol} ${p.name}</div>
      <div class="pos">${formatPos(p.longitude)}</div>
      <div class="house">House ${p.house}</div>
    </div>`).join("");

  const angleData = [
    ["ASC", asc], ["MC", mc], ["DSC", normalize(asc + 180)], ["IC", normalize(mc + 180)]
  ];
  document.getElementById("angleTable").innerHTML = angleData.map(([name, lon]) => `
    <div class="angle-box"><div class="angle-label">${name}</div><div class="angle-value">${formatPos(lon)}</div></div>`).join("");

  document.getElementById("aspectTable").innerHTML = aspects.length
    ? aspects.slice(0, 12).map(a => `<div class="aspect-row"><span style="color:${a.color}">${a.p1.name} - ${a.p2.name}</span><span>${a.name}</span><span>${a.orb.toFixed(1)}&deg;</span></div>`).join("")
    : `<div class="muted">No major aspects inside the selected orbs.</div>`;

  document.getElementById("calcDetails").innerHTML = `
    Source: ${details.source}<br>
    Time conversion: ${details.timeMethod}<br>
    UTC used: ${details.utc.toISOString().replace("T"," ").slice(0,16)}<br>
    Location: ${details.lat.toFixed(4)}, ${details.lon.toFixed(4)}<br>
    Houses: ${details.houseSystem}
  `;
}


async function calculate(){

  try{

    const date = parseDate(birthDate);
    const time = parseTime(birthTime);

    const knownCity =
      cityCoords[birthCity] || {};

    const coords = {
      lat:Number.isFinite(latParam)
        ? latParam
        : knownCity.lat,

      lon:Number.isFinite(lonParam)
        ? lonParam
        : knownCity.lon,

      tz:knownCity.tz
    };

    if(
      !Number.isFinite(coords.lat) ||
      !Number.isFinite(coords.lon)
    ){

      coords.lat = 44.7866;
      coords.lon = 20.4489;
      coords.tz = "Europe/Belgrade";

    }

    const converted =
      localBirthToUtc(
        date,
        time,
        coords
      );

    let source =
      "Node Astro Backend";

    let houseSystem =
      "Equal Houses";

    let data;
    let cusps;
    let ascMc;

    const response =
      await fetch(
`http://localhost:3000/natal?year=${date.year}&month=${date.month}&day=${date.day}&hour=${time.hours}&minute=${time.minutes}&lat=${coords.lat}&lon=${coords.lon}`
      );

    const backend =
      await response.json();

    data = [
      {
        ...planets[0],
        longitude:
          backend.planets.sun.longitude
      },
      {
        ...planets[1],
        longitude:
          backend.planets.moon.longitude
      }
    ];

    ascMc = {

      asc:
        backend.ascendant.longitude,

      mc:
        normalize(
          backend.ascendant.longitude + 90
        )

    };

    cusps =
      equalHouses(
        ascMc.asc
      );

    data.forEach(p => {

      p.house =
        getHouse(
          p.longitude,
          cusps
        );

    });

    const aspects =
      findAspects(data);

    renderWheel(
      data,
      cusps,
      ascMc.asc,
      ascMc.mc,
      aspects
    );

    renderTables(
      data,
      cusps,
      ascMc.asc,
      ascMc.mc,
      aspects,
      {
        source,
        houseSystem,
        utc:converted.utc,
        timeMethod:converted.method,
        lat:coords.lat,
        lon:coords.lon
      }
    );

    document.getElementById(
      "statusLine"
    ).textContent =
      "Node backend connected.";

    hideLoadingPanel();

  }catch(error){

    console.error(error);

    document.getElementById(
      "statusLine"
    ).textContent =
      error.message;

    document.getElementById(
      "statusLine"
    ).classList.add("error");

    hideLoadingPanel();

  }

}
